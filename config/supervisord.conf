[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=true
autorestart=true
priority=10

[program:hillstone-service]
command=/usr/local/bin/start-hillstone-service.sh
autostart=true
autorestart=true
startsecs=3
priority=20
environment=LANG="zh_CN.UTF-8",LANGUAGE="zh_CN:zh",LC_ALL="zh_CN.UTF-8"

[program:desktop]
command=/usr/local/bin/start-desktop.sh
user=desktop
autostart=true
autorestart=true
priority=30
environment=HOME="/home/desktop",USER="desktop",DISPLAY=":1",LANG="zh_CN.UTF-8",LANGUAGE="zh_CN:zh",LC_ALL="zh_CN.UTF-8"

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5901
autostart=true
autorestart=true
startsecs=1
priority=30

[program:socks]
command=/usr/local/bin/start-socks.sh
autostart=true
autorestart=true
priority=60

[program:route-guard]
command=/usr/local/bin/route-guard.sh
autostart=true
autorestart=true
priority=70
