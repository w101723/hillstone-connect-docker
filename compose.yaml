services:
  hillstone-vpn:
    image: ${HILLSTONE_IMAGE:-hillstonenet-hillstone-vpn:bookworm}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${HILLSTONE_CONTAINER_NAME:-hillstone-vpn}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LANG: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      LC_ALL: zh_CN.UTF-8
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1440x900}
      VNC_DEPTH: ${VNC_DEPTH:-24}
      VPN_TUN_REGEX: ${VPN_TUN_REGEX:-^(tun|tap|ppp|hsc|sc)[0-9_-]*$}
      VPN_PROBE_HOST: ${VPN_PROBE_HOST:-}
      SOCKS_ALLOWED_CIDRS: ${SOCKS_ALLOWED_CIDRS:-192.168.0.0/16}
      ENABLE_IPV6: ${ENABLE_IPV6:-false}
      HILLSTONE_SERVICE_COMMAND: ${HILLSTONE_SERVICE_COMMAND:-/opt/apps/hillstonesecureconnect/files/bin/HillstoneSecureConnectService}
      HILLSTONE_GUI_COMMAND: ${HILLSTONE_GUI_COMMAND:-/opt/apps/hillstonesecureconnect/files/bin/HillstoneSecureConnect.sh}
    ports:
      - "${NOVNC_HTTP_BIND_IP:-127.0.0.1}:${NOVNC_HTTP_PORT:-6080}:6080/tcp"
      - "${NOVNC_HTTPS_BIND_IP:-127.0.0.1}:${NOVNC_HTTPS_PORT:-8443}:8443/tcp"
      - "${SOCKS_BIND_IP:-127.0.0.1}:${SOCKS_PORT:-1080}:1080/tcp"
    volumes:
      - ./data/hillstone-config:/home/desktop/.config/HillstoneSecureConnect
      - ./data/hillstone-data:/home/desktop/.local/share/HillstoneSecureConnect
      - ./certs:/certs:ro
    tmpfs:
      - /run
      - /tmp
    networks:
      vpn_net:
        ipv4_address: ${VPN_CONTAINER_IP:-172.30.50.2}

networks:
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${VPN_DOCKER_SUBNET:-172.30.50.0/24}
